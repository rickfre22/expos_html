    <h2>El elemento <object> Este <object>elemento es compatible con todos los navegadores.Este <object>elemento define un objeto incrustado dentro de un documento HTML.

Fue diseñado para integrar complementos (como applets de Java, lectores de PDF y reproductores Flash) en páginas web, pero también se puede utilizar para incluir HTML dentro de HTML:</h2>
    <object width="100%" height="500px" data="ejercicio1.html"></object>
